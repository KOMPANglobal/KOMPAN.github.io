<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator produktu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="../images/logo.png" alt="Logo Firmy" style="max-width: 200px;">
        <h1>Konfigurator produktu</h1>
    </header>
    <h2>Konfigurator produktu</h2>
    <form id="configurator-form">
        
        <!-- Wybór rodzaju produktu -->
        <label for="product-type">Wybierz rodzaj produktu:</label>
        <select id="product-type" name="product-type">
            <option value="furniture">Meble</option>
            <option value="electronics">Elektronika</option>
            <option value="clothing">Odzież</option>
        </select>
        
        <!-- Wybór koloru -->
        <label for="color">Wybierz kolor:</label>
        <select id="color" name="color">
            <option value="red">Czerwony</option>
            <option value="blue">Niebieski</option>
            <option value="green">Zielony</option>
            <option value="white">Biały</option>
            <option value="black">Czarny</option>
        </select>

        <!-- Wybór materiału -->
        <label for="material">Wybierz materiał:</label>
        <select id="material" name="material">
            <option value="wood">Drewno</option>
            <option value="metal">Metal</option>
            <option value="plastic">Plastik</option>
        </select>

        <!-- Wybór rozmiaru -->
        <label for="size">Wybierz rozmiar:</label>
        <select id="size" name="size">
            <option value="small">Mały</option>
            <option value="medium">Średni</option>
            <option value="large">Duży</option>
        </select>

        <button type="button" onclick="generateQuote()">Generuj wycenę</button>
    </form>

    <div id="quote"></div>

    <script>
        function generateQuote() {
            var productType = document.getElementById('product-type').value;
            var color = document.getElementById('color').value;
            var material = document.getElementById('material').value;
            var size = document.getElementById('size').value;

            var quote = 'Wycena dla produktu: ' + productType + ', Kolor: ' + color + ', Materiał: ' + material + ', Rozmiar: ' + size;
            document.getElementById('quote').textContent = quote;
        }
    </script>

    <!-- Linkowanie do plików JavaScript -->
    <script src="../components/gallery.js"></script>       <!-- Logika galerii -->
    <script src="../components/chatBot.js"></script>       <!-- Logika chatbota -->
    <script src="../components/form.js"></script>          <!-- Logika formularza -->

    <script>
        // Inicjalizacja funkcji po załadowaniu strony
        window.addEventListener('DOMContentLoaded', () => {
            initializeGallery();      // Funkcja z gallery.js
            initializeChatBot();      // Funkcja z chatBot.js
            setupFormHandler();       // Funkcja z form.js
        });
    </script>
</body>
</html>
